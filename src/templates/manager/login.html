{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>店舗ログイン - いま弁</title>
    <link rel="stylesheet" href="{% static 'shops/css/style.css' %}">
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="header-title">いま弁 店舗ログイン</div>
            <p class="header-text">店舗スタッフ専用のログイン画面です。</p>
        </div>

        <div class="form-section">
            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <p style="color: red;">
                        ユーザー名またはパスワードが正しくありません。
                    </p>
                {% endif %}

                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">ユーザー名</label>
                    {{ form.username }}
                </div>

                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}">パスワード</label>
                    {{ form.password }}
                </div>

                <button type="submit">ログイン</button>
            </form>
        </div>

        <p>
            <a class="link" href="{% url 'shops:shop_list' %}">ユーザー側一覧へ戻る</a>
        </p>
    </div>
</body>
</html>
